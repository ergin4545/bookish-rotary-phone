<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kimyasal Cephe: İç Savaş</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; user-select: none; font-family: sans-serif; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    
    /* Üst HUD / Bilgiler */
    .hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: #fff; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
    .hud-box { background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid #c9d927; }
    
    /* Mobil Kontroller */
    #joystickZone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); touch-action: none; }
    #joystickKnob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    
    #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; background: rgba(255,50,50,0.3); border-radius: 50%; border: 3px solid rgba(255,50,50,0.8); display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; touch-action: none; }
    #fireBtn:active { background: rgba(255,50,50,0.7); transform: scale(0.95); }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  
  <div class="hud">
    <div class="hud-box" id="aliveDisplay">Kalan: 50</div>
    <div class="hud-box" style="color: #ff5555;" id="killDisplay">Leş: 0</div>
  </div>
  
  <div id="joystickZone"><div id="joystickKnob"></div></div>
  <div id="fireBtn">💥</div>

  <script type="module">
    import * as THREE from 'three';

    // 1. Sahne ve Kamera Ayarları (Tepe Kamera)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f110c);
    scene.fog = new THREE.Fog(0xc9d927, 15, 60); // Sarı Gaz Bulutu

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. Harita / Zemin
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x333b2a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 3. Karakterimiz (Yeşil)
    const playerGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x32cd32 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 1;
    scene.add(player);

    // Silah Namlusu
    const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.8);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.set(0, 0.2, 0.6);
    player.add(gun);

    // 4. Düşmanlar (Kırmızı Botlar)
    const enemies = [];
    const enemyGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
    
    for(let i=0; i<49; i++) {
      const enemy = new THREE.Mesh(enemyGeo, enemyMat);
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * 60 + 10;
      enemy.position.set(Math.cos(angle) * radius, 1, Math.sin(angle) * radius);
      enemy.userData = { alive: true, hp: 100 };
      scene.add(enemy);
      enemies.push(enemy);
    }

    // 5. Oyun Değişkenleri ve Kontroller
    let moveX = 0, moveZ = 0, isFiring = false;
    let pKills = 0, pAlive = 50;

    // Joystick Okuma
    const zone = document.getElementById('joystickZone');
    const knob = document.getElementById('joystickKnob');
    let zoneCenter = {x:0, y:0};

    zone.addEventListener('touchstart', (e) => {
      const rect = zone.getBoundingClientRect();
      zoneCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
      handleMove(e);
    });
    zone.addEventListener('touchmove', handleMove);
    zone.addEventListener('touchend', () => {
      moveX = 0; moveZ = 0;
      knob.style.transform = `translate(-50%, -50%)`;
    });

    function handleMove(e) {
      const touch = e.touches[0];
      let dx = touch.clientX - zoneCenter.x;
      let dy = touch.clientY - zoneCenter.y;
      const dist = Math.min(Math.hypot(dx, dy), 50);
      const angle = Math.atan2(dy, dx);
      
      knob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
      moveX = Math.cos(angle) * (dist/50);
      moveZ = Math.sin(angle) * (dist/50);
    }

    // Ateş Etme Tetikleyicisi
    const fireBtn = document.getElementById('fireBtn');
    fireBtn.addEventListener('touchstart', () => isFiring = true);
    fireBtn.addEventListener('touchend', () => isFiring = false);
    
    // Bilgisayardan test etmek istersen (Mouse Desteği)
    fireBtn.addEventListener('mousedown', () => isFiring = true);
    fireBtn.addEventListener('mouseup', () => isFiring = false);

    // 6. Motor Döngüsü (Oyunun Aktığı Yer)
    const clock = new THREE.Clock();
    let lastFire = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Yürüme Mantığı
      player.position.x += moveX * 14 * delta;
      player.position.z += moveZ * 14 * delta;

      if(moveX !== 0 || moveZ !== 0) {
        player.rotation.y = -Math.atan2(moveZ, moveX) + Math.PI/2;
      }

      // Otomatik Nişan ve Ateş (Auto-Aim)
      if(isFiring && time - lastFire > 0.15) {
        lastFire = time;
        let nearest = null, minDist = 25; // 25 Metre Menzil
        
        enemies.forEach(e => {
          if(!e.userData.alive) return;
          const dist = player.position.distanceTo(e.position);
          if(dist < minDist) { minDist = dist; nearest = e; }
        });

        if(nearest) {
          player.lookAt(nearest.position);
          nearest.userData.hp -= 25; // Hasar
          
          // Silah Ateş Efekti (Namlu Parlaması)
          gunMat.color.setHex(0xffff00);
          setTimeout(() => gunMat.color.setHex(0x222222), 50);

          // Düşman Ölümü
          if(nearest.userData.hp <= 0) {
            nearest.userData.alive = false;
            nearest.rotation.x = Math.PI/2; // Yere devrilme
            nearest.position.y = 0.2;
            pKills++;
            pAlive--;
            document.getElementById('killDisplay').innerText = `Leş: ${pKills}`;
            document.getElementById('aliveDisplay').innerText = `Kalan: ${pAlive}`;
          }
        }
      }

      // Kameranın Oyuncuyu Takip Etmesi (Mobil TPS Açısı)
      camera.position.lerp(new THREE.Vector3(player.position.x, 20, player.position.z + 15), 0.1);
      camera.lookAt(player.position.x, 0, player.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
