<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimyasal Cephe: İç Savaş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f0c; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .game-container { width: 100%; max-width: 480px; height: 100%; max-height: 850px; background: linear-gradient(135deg, #111a13, #050705); position: relative; box-shadow: 0 0 30px rgba(0,255,100,0.2); display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #1f3a22; }

        /* Ekranlar */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; transition: opacity 0.4s ease; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* Ana Menü */
        .logo-area { text-align: center; margin-top: 40px; }
        .logo-area h1 { font-size: 28px; color: #adff2f; text-shadow: 0 0 10px rgba(173,255,47,0.5); letter-spacing: 2px; }
        .logo-area p { font-size: 14px; color: #ff3333; font-weight: bold; margin-top: 5px; }

        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 50px; }
        .btn { background: #1a2e1d; border: 2px solid #32cd32; color: #fff; padding: 15px; font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 8px; text-shadow: 0 0 5px rgba(0,0,0,0.8); transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn:hover { background: #32cd32; color: #0b0f0c; box-shadow: 0 0 20px #32cd32; transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(45deg, #2e8b57, #32cd32); color: #000; font-size: 22px; }

        /* Savaş/Arama Ekranı */
        .matchmaking-screen { background: rgba(0,0,0,0.85); justify-content: center; align-items: center; text-align: center; }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.1); border-top: 6px solid #32cd32; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Cephanelik Ekranı */
        .grid-chars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .char-card { background: #142216; border: 1px solid #2e8b57; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .char-card:hover { border-color: #32cd32; background: #1c331f; }
        .back-btn { background: transparent; border: 1px solid #777; color: #aaa; padding: 10px; border-radius: 5px; cursor: pointer; }
        .back-btn:hover { border-color: #fff; color: #fff; }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="mainMenu" class="screen">
            <div class="logo-area">
                <h1>KİMYASAL CEPHE</h1>
                <p>İÇ SAVAŞ | BATTLE ROYALE</p>
            </div>
            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="startMatchmaking()">OYNA</button>
                <button class="btn" onclick="openScreen('characterScreen')">ASKERLER</button>
                <button class="btn" onclick="openScreen('armoryScreen')">CEPHANELİK</button>
            </div>
        </div>

        <div id="characterScreen" class="screen hidden">
            <div>
                <h2>ASKER SEÇİMİ</h2>
                <div class="grid-chars">
                    <div class="char-card"><b>Taktiksel Nişancı</b><br><small>Hız: Yüksek</small></div>
                    <div class="char-card"><b>Ağır Piyade</b><br><small>Zırh: Maksimum</small></div>
                </div>
            </div>
            <button class="back-btn" onclick="openScreen('mainMenu')">Geri Dön</button>
        </div>

        <div id="armoryScreen" class="screen hidden">
            <div>
                <h2>SİLAHLAR</h2>
                <div class="grid-chars">
                    <div class="char-card"><b>Taarruz Tüfeği</b><br><small>Lazer Nişangah</small></div>
                    <div class="char-card"><b>Kimyasal Pompalı</b><br><small>Yüksek Hasar</small></div>
                </div>
            </div>
            <button class="back-btn" onclick="openScreen('mainMenu')">Geri Dön</button>
        </div>

        <div id="matchmakingScreen" class="screen matchmaking-screen hidden">
            <div>
                <div class="spinner"></div>
                <h2>SAVAŞ ALANI YÜKLENİYOR...</h2>
                <p style="color: #aaa; margin-top: 10px;">Rakipler aranıyor ve cephe kuruluyor.</p>
            </div>
            <button class="back-btn" onclick="openScreen('mainMenu')" style="width: 100%;">İptal Et</button>
        </div>

    </div>

    <script>
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startMatchmaking() {
            openScreen('matchmakingScreen');
            // 3 saniye sonra sanki oyun başlamış gibi ana menüye döndür veya simüle et
            setTimeout(() => {
                alert("Savaş Alanına Atlandın! Çatışma Başlıyor!");
                openScreen('mainMenu');
            }, 3500);
        }
    </script>
</body>
</html>
